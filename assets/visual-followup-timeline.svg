 <filter id="glow"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<ellipse cx="160" cy="184" rx="112" ry="15" fill="#7867ff" opacity=".22" filter="url(#glow)"/>
<path d="M58 111H262" stroke="url(#line)" stroke-width="5" stroke-linecap="round" stroke-dasharray="7 8"/>
<g fill="#102653" stroke="url(#line)" stroke-width="4">
 <circle cx="58" cy="111" r="27"/><circle cx="160" cy="111" r="27"/><circle cx="262" cy="111" r="27"/>

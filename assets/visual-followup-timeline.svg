<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="title desc">
<title id="title">Customer follow-up timeline</title>
<desc id="desc">A customer message moves through a reminder and follow-up to a reply.</desc>
